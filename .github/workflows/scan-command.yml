name: scan-command

# Comment-driven public scanner. Anyone commenting
#   /hookguard-scan owner/repo
# on the pinned scan-request issue gets a full HookGuard report as a reply.
# Public repos only; heuristic results; explicitly not an audit.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: scan-command
  cancel-in-progress: false

jobs:
  scan:
    if: >
      github.event.issue.number == 2 &&
      contains(github.event.comment.body, '/hookguard-scan') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parse target repository
        id: target
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          TARGET=$(printf '%s' "$BODY" | tr -d '\r' | grep -m1 '/hookguard-scan' | awk '{print $2}')
          if ! printf '%s' "$TARGET" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "target=" >> "$GITHUB_OUTPUT"
            echo "Could not parse a repository from: $TARGET" >&2
          else
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge
        if: steps.target.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ github.event.comment.html_url }}
          WHO: ${{ github.event.comment.user.login }}
          TARGET: ${{ steps.target.outputs.target }}
        run: gh issue comment 2 --body "🔎 Scanning \`$TARGET\` (requested by @$WHO — [comment]($URL)). Heuristics only, not an audit."

      - name: Usage hint
        if: steps.target.outputs.target == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ github.event.comment.html_url }}
        run: gh issue comment 2 --body "Could not parse a repository from that comment — use \`/hookguard-scan owner/repo\`."

      - name: Scan
        id: scan
        if: steps.target.outputs.target != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          python3 src/hookguard.py scan "$TARGET" --md /tmp/report.md --json /tmp/r.json

      - name: Post report
        if: steps.target.outputs.target != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const target = '${{ steps.target.outputs.target }}';
            let body;
            try {
              body = fs.readFileSync('/tmp/report.md', 'utf8');
              body += `\n\n<sub>Requested by @${{ github.event.comment.user.login }} · regenerate anytime with \`pip install hookguard\`</sub>`;
            } catch {
              body = `⚠️ Could not complete the scan of \`${target}\` — the repository may be private, empty of Solidity hooks, or the API was unreachable.`;
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 2,
              body
            });
